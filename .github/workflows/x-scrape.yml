name: X scrape

# Runs once a day on GitHub's own schedule, or by hand from the Actions tab. Each run reads
# the last 24 hours of tweets for every active X account.
# 01:30 UTC = 07:00 IST. GitHub can start scheduled runs late (seen: up to 5 hours).
# A late or skipped run loses nothing: the next one reads from where the last successful
# run ended (up to 7 days back).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# One run at a time, shared with x-new-account.yml: a run started while another is going waits
# for it to finish. Two overlapping runs could both create the same tweets.
concurrency:
  group: x-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scrape X
        env:
          AIRTABLE_ACCESS_TOKEN: ${{ secrets.AIRTABLE_ACCESS_TOKEN }}
          TWITTER_API: ${{ secrets.TWITTER_API }}
        run: python3 scripts/x.py
