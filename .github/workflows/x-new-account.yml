name: X new account

# Started by the Airtable automation when the form adds an X account (see README, "New X accounts"),
# with that row's record ID, or by hand from the Actions tab.
#   1. setup: fills the row from its Profile URL (ScrapeCreators profile, 1 credit) and sets
#      Scrape = Active. Skipped when no record ID is given.
#   2. scrape: reads the last 24 hours of every account with no Last Scraped yet, then sets
#      Last Scraped. Makes no API calls if there are none.
on:
  workflow_dispatch:
    inputs:
      record_id:
        description: "Accounts record ID (recXXXXXXXXXXXXXX) of the new X account"
        required: false
        type: string

permissions:
  contents: read

jobs:
  setup:
    if: inputs.record_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fill the account from its Profile URL
        env:
          AIRTABLE_ACCESS_TOKEN: ${{ secrets.AIRTABLE_ACCESS_TOKEN }}
          SCRAPE_CREATORS: ${{ secrets.SCRAPE_CREATORS }}
          RECORD_ID: ${{ inputs.record_id }}
        run: python3 scripts/x_profile.py "$RECORD_ID"

  scrape:
    needs: setup
    # Runs after a successful setup, or on its own when no record ID was given.
    if: ${{ !failure() && !cancelled() }}
    # Shares the scheduled scraper's group, so the two never run at once and create the same
    # tweets. Only this job is in it: setup always runs, so a new account is never skipped. If
    # GitHub drops a waiting scrape job for a newer one, the newer one reads every new account.
    concurrency:
      group: x-scrape
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scrape new X accounts (last 24 hours)
        env:
          AIRTABLE_ACCESS_TOKEN: ${{ secrets.AIRTABLE_ACCESS_TOKEN }}
          TWITTER_API: ${{ secrets.TWITTER_API }}
        run: python3 scripts/x.py --new-accounts
