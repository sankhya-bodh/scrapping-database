name: Tests

# Offline tests: twitterapi.io and Airtable are faked, so no secrets and no credits are used.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 tests/test_x.py
      - name: New account setup tests
        run: python3 tests/test_x_profile.py
      - name: Malformed data
        run: python3 tests/fuzz_x.py
      - name: 30-day simulations
        run: python3 tests/stress_x.py
